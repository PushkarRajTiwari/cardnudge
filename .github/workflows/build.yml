name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APK
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CardNudge-android-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk

  ios:
    name: iOS app (simulator build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests on iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test --no-daemon
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen generate
      - name: Build app for simulator
        run: |
          xcodebuild -project iosApp/CardNudge.xcodeproj -scheme CardNudge -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

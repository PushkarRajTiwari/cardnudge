name: CardNudge
options:
  bundleIdPrefix: com.cardnudge
  deploymentTarget:
    iOS: "15.0"
targets:
  CardNudge:
    type: application
    platform: iOS
    sources: [iosApp]
    scheme: {}
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: CardNudge
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: CardNudge uses your location to find the stores around you.
        NSCameraUsageDescription: CardNudge uses the camera only when you take a photo of your card.
        NSPhotoLibraryUsageDescription: CardNudge lets you choose a photo of your card from your library.
        NSLocationAlwaysAndWhenInUseUsageDescription: CardNudge notices when you walk into a store so it can suggest the best card to pay with.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cardnudge.app
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, ComposeApp, -framework, VisionKit]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
